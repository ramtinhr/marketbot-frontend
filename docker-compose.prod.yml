name: marketbot-frontend
services:
  frontend:
    image: ${MARKETBOT_FRONTEND_IMAGE:?Set MARKETBOT_FRONTEND_IMAGE}
    pull_policy: never
    env_file: .env
    environment:
      NODE_ENV: production
      HOSTNAME: 127.0.0.1
      PORT: ${FRONTEND_PORT:-3001}
      MARKETBOT_DEMO_MODE: 'false'
      MARKETBOT_API_URL: ${MARKETBOT_API_URL:?Set MARKETBOT_API_URL}
      MARKETBOT_APP_ORIGIN: ${MARKETBOT_APP_ORIGIN:?Set MARKETBOT_APP_ORIGIN}
    network_mode: host
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:'+process.env.PORT+'/login',{signal:AbortSignal.timeout(4000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
