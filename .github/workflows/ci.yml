name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Typecheck, tests and gateway
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:gateway
      - name: Validate deployment files
        run: |
          bash -n deploy/*.sh
          python3 -m unittest discover -s deploy -p 'test_*.py' -v
          touch .env
          MARKETBOT_FRONTEND_IMAGE=ci MARKETBOT_API_URL=http://127.0.0.1:8080 MARKETBOT_APP_ORIGIN=https://ci.example docker compose -f docker-compose.prod.yml config -q
  image:
    name: Build and verify container
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build once
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test production container
        env:
          IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          trap 'docker logs frontend-smoke; docker rm -f frontend-smoke' EXIT
          docker run -d --name frontend-smoke -p 127.0.0.1:3001:3001 -e MARKETBOT_DEMO_MODE=false "$IMAGE"
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 5 http://127.0.0.1:3001/login >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker tag "$IMAGE:sha-$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:latest"
      - name: Log in to shared registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.LOCAL_REGISTRY != ''
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ vars.LOCAL_REGISTRY }}
          username: ${{ secrets.LOCAL_REG_USER }}
          password: ${{ secrets.LOCAL_REG_PASS }}
      - name: Publish tested image to shared registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.LOCAL_REGISTRY != ''
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          LOCAL_REGISTRY: ${{ vars.LOCAL_REGISTRY }}
        run: |
          set -euo pipefail
          target="$LOCAL_REGISTRY/${GITHUB_REPOSITORY,,}"
          docker tag "$IMAGE:sha-$GITHUB_SHA" "$target:sha-$GITHUB_SHA"
          docker tag "$IMAGE:sha-$GITHUB_SHA" "$target:latest"
          docker push "$target:sha-$GITHUB_SHA"
          docker push "$target:latest"
