name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Typecheck, tests and gateway
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:gateway
      - name: Validate deployment files
        run: |
          bash -n deploy/*.sh
          python3 -m unittest discover -s deploy -p 'test_*.py' -v
          touch .env
          MARKETBOT_FRONTEND_IMAGE=ci MARKETBOT_API_URL=http://127.0.0.1:8080 MARKETBOT_APP_ORIGIN=https://ci.example docker compose -f docker-compose.prod.yml config -q
  image:
    name: Build and verify container
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build once
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test production container
        env:
          IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          trap 'docker logs frontend-smoke; docker rm -f frontend-smoke' EXIT
          docker run -d --name frontend-smoke -p 127.0.0.1:3001:3001 -e MARKETBOT_DEMO_MODE=false "$IMAGE"
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 5 http://127.0.0.1:3001/login >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker tag "$IMAGE:sha-$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:latest"

  # Announce merges to main in Telegram. Requires the repository secrets
  # TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID_CICD; with either unset the job runs
  # and quietly does nothing.
  notify:
    name: Notify Telegram
    runs-on: ubuntu-latest
    needs: [checks, image]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # The commit subject and author are attacker-controlled text: they reach
      # bash through the environment, never through ${{ }} interpolation.
      - name: Compose message
        id: msg
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
        run: |
          set -euo pipefail

          escape() { sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }

          subject=$(printf '%s' "$COMMIT_MESSAGE" | head -n 1 | escape)
          author=$(printf '%s' "$COMMIT_AUTHOR" | escape)
          short_sha=$(printf '%s' "${{ github.sha }}" | cut -c1-7)
          repo_url="${{ github.server_url }}/${{ github.repository }}"

          if [ "$CHECKS_RESULT" = "success" ] && [ "$IMAGE_RESULT" = "success" ]; then
            headline="✅ <b>marketbot-frontend merged to main</b>"
            status="CI green - image pushed as <code>latest</code>"
          else
            headline="❌ <b>marketbot-frontend merged to main - CI failed</b>"
            status="checks: <code>${CHECKS_RESULT}</code> · image: <code>${IMAGE_RESULT}</code>"
          fi

          {
            echo "text<<TELEGRAM_EOF"
            echo "${headline}"
            echo ""
            echo "<code>${short_sha}</code> ${subject}"
            echo "👤 ${author}"
            echo "🔧 ${status}"
            echo ""
            echo "<a href=\"${repo_url}/commit/${{ github.sha }}\">commit</a> · <a href=\"${repo_url}/actions/runs/${{ github.run_id }}\">CI run</a>"
            echo "TELEGRAM_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/telegram-notify
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID_CICD }}
          message: ${{ steps.msg.outputs.text }}
